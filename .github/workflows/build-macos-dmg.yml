name: Build SleepGuard macOS Intel DMG

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-intel:
    name: Build DMG (Intel x86_64)
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install official Qt 6 (Intel)
        shell: bash
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "x86_64"
          sw_vers
          python3 --version
          python3 -m venv "$RUNNER_TEMP/qt-venv"
          source "$RUNNER_TEMP/qt-venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install "aqtinstall==3.3.0"
          rm -rf "$RUNNER_TEMP/Qt"
          # Official prebuilt Qt package; no Homebrew Qt and no source compilation.
          aqt install-qt mac desktop 6.8.3 clang_64 -m qtconnectivity -O "$RUNNER_TEMP/Qt"
          QT_ROOT="$RUNNER_TEMP/Qt/6.8.3/macos"
          test -d "$QT_ROOT"
          test -x "$QT_ROOT/bin/macdeployqt"
          test -x "$QT_ROOT/bin/qmake"
          echo "QT_ROOT=$QT_ROOT" >> "$GITHUB_ENV"
          echo "$QT_ROOT/bin" >> "$GITHUB_PATH"
          echo "Qt root: $QT_ROOT"
          "$QT_ROOT/bin/qmake" -v
          "$QT_ROOT/bin/macdeployqt" -h | head -n 12

      - name: Show toolchain
        shell: bash
        run: |
          set -euxo pipefail
          uname -m
          cmake --version
          clang++ --version
          qmake -v
          macdeployqt -h | head -n 8

      - name: Configure
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT" \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build --config Release --parallel 3
          file build/SleepGuard
          lipo -info build/SleepGuard

      - name: Create app and DMG
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x deploy_macos.sh
          ./deploy_macos.sh
          test -d build/SleepGuard.app
          test -f build/SleepGuard.dmg
          mv build/SleepGuard.dmg build/SleepGuard-Intel-x86_64.dmg

      - name: Verify DMG architecture
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/sleepguard-dmg
          mkdir -p /tmp/sleepguard-dmg
          hdiutil attach build/SleepGuard-Intel-x86_64.dmg -nobrowse -readonly -mountpoint /tmp/sleepguard-dmg
          file /tmp/sleepguard-dmg/SleepGuard.app/Contents/MacOS/SleepGuard
          lipo -info /tmp/sleepguard-dmg/SleepGuard.app/Contents/MacOS/SleepGuard
          file /tmp/sleepguard-dmg/SleepGuard.app/Contents/MacOS/SleepGuard | grep -q 'x86_64'
          hdiutil detach /tmp/sleepguard-dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: SleepGuard-macOS-Intel-x86_64
          path: build/SleepGuard-Intel-x86_64.dmg
          if-no-files-found: error
          retention-days: 14
